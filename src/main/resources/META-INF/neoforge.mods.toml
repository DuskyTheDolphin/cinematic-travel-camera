[[mods]]
modId="forgeward_travelcam"
version="1.1.4"
displayName="Cinematic Travel Camera"
authors="DuskyTheDolphin"
displayURL="https://github.com/DuskyTheDolphin/cinematic-travel-camera"
description='''
Client-only: press the key while travelling and the camera cuts between film-style angles while you keep moving. Your keys
still steer; only the view changes. Press again to return. Default key Ctrl+N (Controls > Cinematic Travel Camera).
Nothing is ever sent to the server, and the player stays where they are.
'''

[[dependencies.forgeward_travelcam]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[mixins]]
    config="forgeward_travelcam.mixins.json"
